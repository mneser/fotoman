# colligator.com — nginx terminates TLS, then splits traffic:
#   /fotomob → fotomob (127.0.0.1:3001)
#   everything else → colligator (127.0.0.1:3000)
#
# Install on the VPS:
#   cp deploy/nginx-colligator.com.conf /etc/nginx/sites-available/colligator.com
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name colligator.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name colligator.com;

    ssl_certificate     /etc/nginx/ssl/colligator.com.crt;
    ssl_certificate_key /etc/nginx/ssl/colligator.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 80m;

    location /fotomob {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
