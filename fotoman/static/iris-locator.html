<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iris locator</title>
  <style>
    :root {
      --bg: #0e100f;
      --fg: #e8eee9;
      --muted: #9aa89e;
      --accent: #7ec8a3;
      --ring: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #2a322e;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    header p {
      margin: 0;
      color: var(--muted);
      flex: 1 1 12rem;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, monospace;
      font-size: 12px;
    }
    .stats span { color: var(--accent); }
    main {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      padding: 1rem;
      align-items: start;
      overflow: auto;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .stage-wrap {
      overflow: auto;
      border: 1px solid #2a322e;
      border-radius: 10px;
      background: #000;
      max-height: calc(100vh - 6rem);
    }
    .stage {
      position: relative;
      display: inline-block;
      cursor: crosshair;
      user-select: none;
      touch-action: none;
    }
    .stage img {
      display: block;
      max-width: none;
      width: 1230px;
      height: 360px;
      image-rendering: auto;
    }
    .ring {
      position: absolute;
      border: 2px solid var(--ring);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(0,0,0,0.4);
      display: none;
    }
    .ring.show { display: block; }
    .cross {
      position: absolute;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      pointer-events: none;
      display: none;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 107, 0.7);
      background: rgba(255, 107, 107, 0.12);
    }
    .cross.show { display: block; }
    .cross::before, .cross::after {
      content: "";
      position: absolute;
      background: var(--ring);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
    }
    .cross::before { left: 13px; top: 4px; width: 2px; height: 20px; }
    .cross::after { top: 13px; left: 4px; height: 2px; width: 20px; }
    .stage.move { cursor: move; }
    .stage.resize { cursor: nwse-resize; }
    .mode {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 0.55rem;
    }
    .mode button {
      flex: 1;
    }
    .mode button.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    aside {
      width: min(280px, 100%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card {
      border: 1px solid #2a322e;
      border-radius: 10px;
      padding: 0.85rem;
      background: #161a18;
    }
    .card h2 {
      margin: 0 0 0.6rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
    }
    .preview-frame {
      width: 160px;
      height: 160px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      border: 1px solid #2a322e;
    }
    .preview-frame.spinning {
      animation: spin 1.1s linear infinite;
    }
    .preview-inner {
      width: 100%;
      height: 100%;
      background-image: url("/fotoman.png");
      background-repeat: no-repeat;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.65rem;
      color: var(--muted);
      cursor: pointer;
    }
    code, textarea {
      display: block;
      width: 100%;
      font: 11px/1.45 ui-monospace, monospace;
      color: var(--fg);
      background: #0e100f;
      border: 1px solid #2a322e;
      border-radius: 6px;
      padding: 0.55rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
    textarea {
      min-height: 7.5rem;
      resize: vertical;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.55rem;
    }
    button {
      font: inherit;
      border-radius: 7px;
      border: 1px solid #3a453f;
      background: #222826;
      color: var(--fg);
      padding: 0.35rem 0.65rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .hint { color: var(--muted); font-size: 12px; margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Iris locator</h1>
    <p>Drag the crosshair to move the center, or drag the ring edge to resize. Arrow keys nudge center (Shift = 5px, Alt = radius).</p>
    <div class="stats">
      <div>cx <span id="s-cx">—</span></div>
      <div>cy <span id="s-cy">—</span></div>
      <div>r <span id="s-r">—</span></div>
      <div>size <span id="s-size">1230×360</span></div>
    </div>
  </header>
  <main>
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <img id="logo" src="/fotoman.png" width="1230" height="360" alt="fotoman logo" draggable="false" />
        <div class="ring" id="ring"></div>
        <div class="cross" id="cross"></div>
      </div>
    </div>
    <aside>
      <div class="card">
        <h2>Crop preview</h2>
        <div class="mode">
          <button type="button" id="mode-move" class="active">Move center</button>
          <button type="button" id="mode-resize">Resize</button>
        </div>
        <div class="preview-frame" id="preview-frame">
          <div class="preview-inner" id="preview"></div>
        </div>
        <label><input type="checkbox" id="spin" checked /> Spin preview</label>
        <p class="hint" style="margin-top:0.55rem">Aim for the outer edge of the colorful blades (inside the dark lens ring).</p>
      </div>
      <div class="card">
        <h2>Values</h2>
        <textarea id="out" readonly placeholder="Click the iris…"></textarea>
        <div class="actions">
          <button type="button" id="copy">Copy</button>
          <button type="button" id="reset">Reset</button>
        </div>
      </div>
    </aside>
  </main>
  <script>
    const W = 1230, H = 360;
    const stage = document.getElementById("stage");
    const ring = document.getElementById("ring");
    const cross = document.getElementById("cross");
    const preview = document.getElementById("preview");
    const previewFrame = document.getElementById("preview-frame");
    const out = document.getElementById("out");
    const spin = document.getElementById("spin");

    let cx = null, cy = null, r = null;
    let dragMode = null; // "move" | "resize"
    let toolMode = "move"; // default tool
    let dragDx = 0, dragDy = 0;

    // Seed from chroma centroid of the iris blades
    const GUESS = { cx: 329, cy: 191, r: 134 };

    const modeMove = document.getElementById("mode-move");
    const modeResize = document.getElementById("mode-resize");

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function setTool(mode) {
      toolMode = mode;
      modeMove.classList.toggle("active", mode === "move");
      modeResize.classList.toggle("active", mode === "resize");
      stage.classList.toggle("move", mode === "move");
      stage.classList.toggle("resize", mode === "resize");
    }

    function posFromEvent(e) {
      const rect = stage.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * W;
      const y = ((e.clientY - rect.top) / rect.height) * H;
      return { x: clamp(x, 0, W), y: clamp(y, 0, H) };
    }

    function render() {
      const has = cx != null && cy != null && r != null && r > 0;
      ring.classList.toggle("show", has);
      cross.classList.toggle("show", cx != null && cy != null);
      document.getElementById("s-cx").textContent = cx == null ? "—" : cx.toFixed(1);
      document.getElementById("s-cy").textContent = cy == null ? "—" : cy.toFixed(1);
      document.getElementById("s-r").textContent = r == null ? "—" : r.toFixed(1);

      if (cx != null && cy != null) {
        cross.style.left = `${(cx / W) * 100}%`;
        cross.style.top = `${(cy / H) * 100}%`;
      }
      if (has) {
        const d = r * 2;
        ring.style.left = `${((cx - r) / W) * 100}%`;
        ring.style.top = `${((cy - r) / H) * 100}%`;
        ring.style.width = `${(d / W) * 100}%`;
        ring.style.height = `${(d / H) * 100}%`;

        // CSS background crop into a square of side 2r centered on (cx,cy)
        const scale = 160 / d;
        preview.style.backgroundSize = `${W * scale}px ${H * scale}px`;
        preview.style.backgroundPosition = `${-(cx - r) * scale}px ${-(cy - r) * scale}px`;

        const css = [
          `/* iris crop from fotoman.png (${W}×${H}) */`,
          `cx: ${cx.toFixed(1)}  cy: ${cy.toFixed(1)}  r: ${r.toFixed(1)}`,
          `diameter: ${(r * 2).toFixed(1)}px`,
          ``,
          `.busy-iris {`,
          `  width: 2.6rem;`,
          `  height: 2.6rem;`,
          `  border-radius: 50%;`,
          `  overflow: hidden;`,
          `  background: #000 url("/fotoman.png") no-repeat;`,
          `  background-size: ${(W / d * 2.6).toFixed(3)}rem ${(H / d * 2.6).toFixed(3)}rem;`,
          `  background-position: ${(-((cx - r) / d) * 2.6).toFixed(3)}rem ${(-((cy - r) / d) * 2.6).toFixed(3)}rem;`,
          `  animation: busy-spin 1.1s linear infinite;`,
          `}`,
        ].join("\n");
        out.value = css;
      } else {
        out.value = "";
        preview.style.backgroundSize = "";
        preview.style.backgroundPosition = "";
      }
      previewFrame.classList.toggle("spinning", spin.checked && has);
    }

    stage.addEventListener("pointerdown", (e) => {
      stage.setPointerCapture(e.pointerId);
      const { x, y } = posFromEvent(e);
      if (cx == null) {
        cx = x; cy = y;
        r = r || GUESS.r;
        dragMode = "move";
        dragDx = 0; dragDy = 0;
      } else if (e.shiftKey || toolMode === "move") {
        dragMode = "move";
        dragDx = cx - x;
        dragDy = cy - y;
        cx = clamp(x + dragDx, 0, W);
        cy = clamp(y + dragDy, 0, H);
      } else {
        dragMode = "resize";
        r = Math.max(4, Math.hypot(x - cx, y - cy));
      }
      render();
    });

    stage.addEventListener("pointermove", (e) => {
      if (!dragMode || cx == null) return;
      const { x, y } = posFromEvent(e);
      if (dragMode === "move") {
        cx = clamp(x + dragDx, 0, W);
        cy = clamp(y + dragDy, 0, H);
      } else {
        r = Math.max(4, Math.hypot(x - cx, y - cy));
      }
      render();
    });

    stage.addEventListener("pointerup", () => { dragMode = null; });
    stage.addEventListener("pointercancel", () => { dragMode = null; });

    window.addEventListener("keydown", (e) => {
      if (cx == null) return;
      if (e.key === "m" || e.key === "M") { setTool("move"); return; }
      if (e.key === "r" || e.key === "R") { setTool("resize"); return; }
      const step = e.shiftKey ? 5 : 1;
      let handled = true;
      if (e.altKey) {
        if (e.key === "ArrowUp" || e.key === "ArrowRight") r = (r || 0) + step;
        else if (e.key === "ArrowDown" || e.key === "ArrowLeft") r = Math.max(4, (r || 0) - step);
        else handled = false;
      } else {
        if (e.key === "ArrowLeft") cx -= step;
        else if (e.key === "ArrowRight") cx += step;
        else if (e.key === "ArrowUp") cy -= step;
        else if (e.key === "ArrowDown") cy += step;
        else handled = false;
      }
      if (!handled) return;
      e.preventDefault();
      cx = clamp(cx, 0, W);
      cy = clamp(cy, 0, H);
      render();
    });

    modeMove.addEventListener("click", () => setTool("move"));
    modeResize.addEventListener("click", () => setTool("resize"));
    spin.addEventListener("change", render);
    document.getElementById("copy").addEventListener("click", async () => {
      if (!out.value) return;
      await navigator.clipboard.writeText(out.value);
      const btn = document.getElementById("copy");
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = "Copy"; }, 900);
    });
    document.getElementById("reset").addEventListener("click", () => {
      cx = cy = r = null;
      render();
    });

    // Seed a guess so preview is immediately useful
    ({ cx, cy, r } = { ...GUESS });
    setTool("move");
    render();
  </script>
</body>
</html>
